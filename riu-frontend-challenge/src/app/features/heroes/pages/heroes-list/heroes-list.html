<section class="container text-center">
  <div class="d-flex justify-between py-lg">
    <input class="form-control ml-lg" type="search" [formControl]="searchControl" placeholder="Buscar superheroe"
            aria-label="Buscar superheroe por nombre" />
    <span class="mx-lg"></span>
    <app-button variant="primary" (clicked)="navigateToCreateHeroe()">
      Crear Superheroe
    </app-button>
  </div>

  @if (error()) {
  <app-alert title="Error" [message]="error()!" variant="error" />
  <app-button variant="primary" (clicked)="loadHeroes()">
    Reintentar
  </app-button>

  } @else if (heroes().length === 0) {
  <app-alert title="Sin Superheroes" message="No existen superheroes registrados." variant="info" />
  } @else {

  <table class="table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Superpoder</th>
        <th>Debilidad</th>
        <th>Enemigo</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (heroes of heroes(); track heroes.id) {
      <tr class="table__row table__row--clickable">
        <td>{{ heroes.name }}</td>
        <td>{{ heroes.superpower }}</td>
        <td>{{ heroes.weakness }}</td>
        <td>{{ heroes.enemy }}</td>
        <td>
          <div class="d-flex gap-sm">
            <app-button size="sm" variant="secondary" (clicked)="editHeroe(heroes.id)">
              Editar
            </app-button>
            <app-button size="sm" variant="danger" (clicked)="openDeleteModal(heroes.id)">
              Eliminar
            </app-button>
          </div>

        </td>
      </tr>
      }
    </tbody>
  </table>
  }
  <app-modal [(isOpen)]="deleteModalOpen" title="Eliminar superheroe"
    message="¿Estás seguro de que querés eliminar este Superheroe? Esta acción no se puede deshacer."
    confirmText="Eliminar" cancelText="Cancelar" (confirmed)="deleteHeroe(idHeroeDelete())" />
</section>
